name: Update data

on:
  schedule:
    # Target: 05:18 UK on weekdays, before the London open. GitHub often
    # starts scheduled runs late (hours late at busy times) and sometimes
    # drops them, so there are several slots up to ~08:30 UK; the gate job
    # runs the first one at or after 05:18 UK and skips the rest once a
    # fetch has succeeded today. Staggered with the other dashboards (UK
    # 05:13, Fed 05:18, macro monitor 05:33), which share one Refinitiv
    # account that allows a single session at a time.
    - cron: '18,48 4-7 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Write output and redeploy even if nothing changed'
        type: boolean
        default: false
      refinitiv:
        description: 'Log in to Refinitiv (untick to refresh without touching the Refinitiv session)'
        type: boolean
        default: true

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: read   # the gate checks whether today's fetch already ran

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          now=$(TZ=Europe/London date +%H%M); dow=$(TZ=Europe/London date +%u)
          if [ "$dow" -gt 5 ] || [ "$now" -lt 0518 ] || [ "$now" -ge 0830 ]; then
            echo "Outside the 05:18-08:30 UK weekday window ($now); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Skip if a fetch already succeeded today (since 05:00 UK).
          since=$(date -u -d "@$(TZ=Europe/London date -d 'today 05:00' +%s)" +%Y-%m-%dT%H:%M:%SZ)
          repo="${{ github.repository }}"
          for id in $(gh api "repos/$repo/actions/workflows/update-data.yml/runs?created=%3E%3D$since&status=success&per_page=30" --jq '.workflow_runs[].id'); do
            n=$(gh api "repos/$repo/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name=="fetch" and .conclusion=="success")] | length')
            if [ "${n:-0}" -gt 0 ]; then
              echo "Today's fetch already ran (run $id); skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r fetcher/requirements.txt

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Manual runs can untick "refinitiv" to refresh without logging in.
          # Scheduled runs have no inputs, and GitHub treats a missing input as
          # equal to false, so the skip must apply to manual runs only.
          REFINITIV_DISABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.refinitiv == false && 'true' || 'false' }}
          REFINITIV_CLIENT_ID: ${{ secrets.REFINITIV_CLIENT_ID }}
          REFINITIV_CLIENT_SECRET: ${{ secrets.REFINITIV_CLIENT_SECRET }}
          REFINITIV_USERNAME: ${{ secrets.REFINITIV_USERNAME }}
          REFINITIV_PASSWORD: ${{ secrets.REFINITIV_PASSWORD }}
          REFINITIV_APP_KEY: ${{ secrets.REFINITIV_APP_KEY }}
        run: python fetcher/fetch.py ${{ inputs.force && '--force' || '' }}

      - name: Commit updated data
        id: commit
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes — nothing to commit."
            echo "changed=${{ inputs.force && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          LATEST=$(python -c "import json;print(json.load(open('data/meta.json'))['latest_daily'])")
          git commit -m "data: refresh through ${LATEST}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the commit the fetch job just pushed

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the dashboard
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
