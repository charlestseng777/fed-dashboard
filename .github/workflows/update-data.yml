name: Update data

on:
  schedule:
    # Once a night at 23:45 UK time, Mon–Fri. Cron is UTC and doesn't follow
    # daylight saving, so there is a slot for each: 22:45 UTC is 23:45 in
    # summer (BST), 23:45 UTC is 23:45 in winter (GMT). The gate job below
    # lets only the one that lands at 23:45 UK time through.
    - cron: '45 22 * * 1-5'
    - cron: '45 23 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Write output and redeploy even if nothing changed'
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        # Scheduled runs go ahead only between 23:40 and 00:40 UK time: the
        # right slot for the season lands there (GitHub can start scheduled
        # jobs a few minutes late), the other one lands an hour off and is
        # skipped. Manual runs always go ahead.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          now=$(TZ=Europe/London date +%H%M)
          echo "UK time is ${now}"
          if [ "$now" -ge 2340 ] || [ "$now" -lt 40 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 23:45 UK time in this season; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r fetcher/requirements.txt

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REFINITIV_CLIENT_ID: ${{ secrets.REFINITIV_CLIENT_ID }}
          REFINITIV_CLIENT_SECRET: ${{ secrets.REFINITIV_CLIENT_SECRET }}
          REFINITIV_USERNAME: ${{ secrets.REFINITIV_USERNAME }}
          REFINITIV_PASSWORD: ${{ secrets.REFINITIV_PASSWORD }}
          REFINITIV_APP_KEY: ${{ secrets.REFINITIV_APP_KEY }}
        run: python fetcher/fetch.py ${{ inputs.force && '--force' || '' }}

      - name: Commit updated data
        id: commit
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes — nothing to commit."
            echo "changed=${{ inputs.force && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          LATEST=$(python -c "import json;print(json.load(open('data/meta.json'))['latest_daily'])")
          git commit -m "data: refresh through ${LATEST}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the commit the fetch job just pushed

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the dashboard
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
